name: Windows regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile application and scripts
        run: python -m compileall -q msfs_builder_gui.py app_support.py rule_editor.py texture_table.py scripts tests
      - name: GUI startup
        run: python msfs_builder_gui.py --self-test
      - name: Regression tests without simulator assets
        run: python -m unittest discover -s tests -p "test_*.py" -v
